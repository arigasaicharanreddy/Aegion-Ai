services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aegion
      POSTGRES_USER: aegion
      POSTGRES_PASSWORD: aegion_dev_password
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
